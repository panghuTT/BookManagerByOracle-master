<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>在线借阅平台</title>

    <style>
        .my-big-title{
            height: 60px; line-height: 60px; font-size: 24px; padding-left: 30px;
        }
        .my-nav{
            float: right;
        }
        .my-main-body{
            color: #898989; font-size: 16px; margin: 30px;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
        }
        .my-book-item{
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
            transition: all 0.3s;
        }
        .my-book-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }
        .my-book-name{
            font-size: 24px; color: black;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .my-button{
            margin-top: 15px;
            transition: all 0.3s;
        }
        .my-button:hover {
            transform: scale(1.05);
        }
        .my-img-size{
            width: 150px; height: 200px;
            border-radius: 4px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
            transition: all 0.3s;
        }
        .my-img-size:hover {
            transform: scale(1.05);
        }
        .my-book-isBorrowed{
            color: #FF5722;
            font-weight: bold;
        }
        .my-book-isNotBorrowed{
            color: #1E9FFF;
            font-weight: bold;
        }
        /*单行文本的溢出显示省略号*/
        .pl{
            overflow:hidden;
            text-overflow:ellipsis;
            white-space: nowrap;
        }
        /*多行文本溢出显示省略号*/
        .p2{
            overflow:hidden;
            text-overflow:ellipsis;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }
        /*分类导航样式*/
        .category-nav {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 20px;
            margin-bottom: 30px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
            gap: 15px;
        }
        .category-nav::-webkit-scrollbar {
            height: 6px;
        }
        .category-nav::-webkit-scrollbar-thumb {
            background: #009688;
            border-radius: 3px;
        }
        .category-item {
            padding: 12px 25px;
            background: #f8f8f8;
            border-radius: 30px;
            color: #333;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        .category-item i {
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .category-item:hover {
            background: #009688;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,150,136,.3);
        }
        .category-item:hover i {
            transform: scale(1.2);
        }
        .category-item.active {
            background: #009688;
            color: #fff;
            border-color: #009688;
            box-shadow: 0 5px 15px rgba(0,150,136,.3);
        }
        .category-item.active i {
            transform: scale(1.2);
        }
        /*分页样式*/
        #my_page {
            margin-top: 30px;
            text-align: center;
        }
        /*静态组件样式*/
        .static-components {
            margin-bottom: 30px;
        }
        .feature-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,.2);
        }
        .feature-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .feature-content {
            color: #666;
            line-height: 1.6;
        }
        .notice-board {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,.1);
            margin-bottom: 20px;
        }
        .notice-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .notice-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .notice-item {
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .notice-item:last-child {
            border-bottom: none;
        }
        .notice-item-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }
        .notice-item-time {
            font-size: 12px;
            color: #999;
        }
    </style>

    <!-- 导入layui css -->
    <link rel="stylesheet" href="../layuimini/lib/layui-v2.6.3/css/layui.css" media="all">
    <!-- 导入layui js -->
    <script src="../layuimini/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
    <!-- 导入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<div class="layui-container">
    <div class="layui-row" style="background-color: #009688; color: white">
        <div class="layui-col-md5 my-big-title">
            <img src="../layuimini/images/jlu-logo.png" style="height: 45px">
            图书管理系统—在线借阅平台
        </div>
        <div class="layui-col-md7">
            <ul class="layui-nav layui-bg-green my-nav">
                <li class="layui-nav-item">
                    <a href="./reader_index.html">首页</a>
                </li>
                <li class="layui-nav-item">
                    <a href="./reader_book_list.html">全部图书</a>
                </li>
                <li class="layui-nav-item layui-this">
                    <a href="./reader_book_classification.html">图书分类</a>
                </li>
                <li class="layui-nav-item">
                    <a href="./reader_borrow.html">我的借阅</a>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;" id="my-about">关于</a>
                </li>
                <li class="layui-nav-item">
                    <a href="javascript:;"><span id="my_name">未登录</span></a>
                    <dl class="layui-nav-child">
                        <dd><a href="./reader_password.html">修改密码</a></dd>
                        <dd><a href="javascript:;" id="login-out">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="my-main-body">
        <fieldset class="layui-elem-field layui-field-title">
            <legend>图书分类（点击对应分类查看书籍）</legend>
        </fieldset>

        <!-- 静态组件区域 -->
        <div class="static-components">
            <!-- 功能卡片 -->
            <div class="feature-card">
                <div class="feature-title">
                    <i class="fas fa-lightbulb"></i> 借阅指南
                </div>
                <div class="feature-content">
                    <p>1. 每本书借阅期限为30天</p>
                    <p>2. 每人最多可同时借阅5本书</p>
                    <p>3. 逾期归还将收取滞纳金</p>
                    <p>4. 请爱护图书，按时归还</p>
                </div>
            </div>
        </div>

        <div class="category-nav" id="my_type">
            <!-- 动态添加分类 -->
        </div>

        <div class="layui-row" id="my_content">
            <!-- 动态添加内容 -->
        </div>

        <div id="my_page"></div>
    </div>
</div>

<script>
    function getQueryVariable(variable)
    {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i=0;i<vars.length;i++) {
            var pair = vars[i].split("=");
            if(pair[0] === variable){return pair[1];}
        }
        return null;
    }

    layui.use(['laypage', 'form'], function(){
        var laypage = layui.laypage,
                layer = layui.layer,
                form = layui.form,
                $ = layui.$;

        var objUserid;
        $.ajax({
            url: '../user/reader/getUser',
            type: 'post',
            datatype: 'json',
            success: function (userObj) {
                $("#my_name").text(userObj.username);
                objUserid = userObj.userid;
            }
        });

        $("#login-out").on("click", function () {
            $.ajax({
                url: '../user/reader/exitLogin',
                type: 'get',
                success: function () {
                    layer.msg('退出登录成功', {time:1000}, function () {
                        window.location = '../index.html';
                    });
                }
            });
        });

        $("#my-about").on("click", function () {
            layer.open({
                title: '关于信息',
                content: '系统名称：图书管理系统<br>作者：王睿 李章钥 刘湘湘<br>联系QQ：742926413',
                end: function () {
                    location.reload();
                }
            });
        });

        $.ajax({
            url: '../bookType/reader/queryBookTypes',
            type: 'get',
            datatype: 'json',
            success: function (mdata) {
                console.log(mdata);
                $("#my_type").html("");
                for(var i = 0; i < mdata.length; i++) {
                    var activeClass = '';
                    if (getQueryVariable('booktypeid') === mdata[i].booktypeid) {
                        activeClass = 'active';
                    }
                    var iconClass = getIconClass(mdata[i].booktypename);
                    $("#my_type").append("<a class=\"category-item " + activeClass + "\" href=\"./reader_book_classification.html?booktypeid=" + mdata[i].booktypeid + "\"><i class=\"" + iconClass + "\"></i>" + mdata[i].booktypename + "</a>");
                }
            }
        });

        function getIconClass(bookTypeName) {
            var iconMap = {
                '计算机科学': 'fas fa-laptop-code',
                '历史': 'fas fa-landmark',
                '文学': 'fas fa-book-open',
                '艺术': 'fas fa-palette',
                '科学': 'fas fa-flask',
                '哲学': 'fas fa-brain',
                '经济': 'fas fa-chart-line',
                '教育': 'fas fa-graduation-cap',
                '医学': 'fas fa-heartbeat',
                '法律': 'fas fa-gavel',
                '心理学': 'fas fa-brain',
                '社会学': 'fas fa-users',
                '政治': 'fas fa-university',
                '宗教': 'fas fa-church',
                '体育': 'fas fa-running',
                '旅游': 'fas fa-plane',
                '美食': 'fas fa-utensils',
                '建筑': 'fas fa-building',
                '音乐': 'fas fa-music',
                '电影': 'fas fa-film'
            };
            return iconMap[bookTypeName] || 'fas fa-book';
        }

        var paramBookTypeid = decodeURI(getQueryVariable('booktypeid'));

        // 先从服务器中获取数据的总数，初始化数据
        if(paramBookTypeid !== "null") {
            $.ajax({
                url: '../bookInfo/reader/getCountByType',
                data: {
                    booktypeid: paramBookTypeid
                },
                type: 'get',
                datatype: 'json',
                success: function (bookCount) {
                    //执行一个laypage实例
                    laypage.render({
                        elem: 'my_page',
                        count: bookCount,
                        limit: 6,
                        limits: [4, 6, 8, 10, 12, 14, 16, 18, 20],
                        layout: ['prev', 'page', 'next', 'limit', 'skip', 'count'],
                        jump: function(obj, first){
                            $.ajax({
                                url: '../bookInfo/reader/queryBookInfosByPageByType',
                                data: {
                                    page: obj.curr,
                                    limit: obj.limit,
                                    booktypeid: paramBookTypeid
                                },
                                type: 'get',
                                datatype: 'json',
                                success: function (res) {
                                    console.log(res);
                                    var mdata = res.data;
                                    $("#my_content").html("");
                                    for(var i = 0; i < mdata.length; i++) {
                                        var colorClass, word, buttonClass;
                                        if (Number(mdata[i].isborrowed) === 1) {
                                            colorClass = "my-book-isBorrowed";
                                            word = "已借出";
                                            buttonClass = "layui-btn-disabled";
                                        } else {
                                            colorClass = "my-book-isNotBorrowed";
                                            word = "可以借";
                                            buttonClass = "";
                                        }
                                        $("#my_content").append("<div class=\"layui-inline layui-col-md6 my-book-item\">\n" +
                                                "                <div class=\"layui-col-md4\">\n" +
                                                "                    <img class=\"my-img-size\" src=\"" + mdata[i].bookimg + "\">\n" +
                                                "                </div>\n" +
                                                "                <div class=\"layui-col-md8\">\n" +
                                                "                    <p class=\"p1\"><a href=\"#\"><span class=\"my-book-name\">" + mdata[i].bookname + "</span></a></p>\n" +
                                                "                    <p class=\"p1\">作者：" + mdata[i].bookauthor + "</span></p>\n" +
                                                "                    <p class=\"p1\">价格：" + mdata[i].bookprice + "</span></p>\n" +
                                                "                    <p class=\"p1\">分类：" + mdata[i].booktypename + "</span></p>\n" +
                                                "                    <p class=\"p2\" title=\"" + mdata[i].bookdesc + "\">描述：" + mdata[i].bookdesc + "</span></p>\n" +
                                                "                    <p class=\"p1\">借出情况：<span class=\"" + colorClass + "\">" + word + "</span></p>\n" +
                                                "                    <button class=\"layui-btn my-button my-borrow-button " + buttonClass + "\" bookid=\"" + mdata[i].bookid + "\">我要借书</button>\n" +
                                                "                </div>\n" +
                                                "            </div>\n");
                                    }
                                }
                            });
                        }
                    });
                }
            });
        }

        $(document).on('click','.my-borrow-button',function(){
            var bookid = $(this).attr("bookid");
            // 如果是disabled不响应监听
            if($(this).hasClass('layui-btn-disabled')) return;

            layer.confirm('您确定要借书吗', {
                btn: ['确定','取消'] //按钮
            }, function(){
                $.ajax({
                    url: '../borrow/reader/borrowBook',
                    data: {
                        userid: objUserid,
                        bookid: bookid
                    },
                    type: 'post',
                    datatype: 'json',
                    success: function (res) {
                        if(res !== 0) {
                            layer.msg('借书成功', {time: 1000}, function () {
                                location.reload();
                            });
                        }
                        else layer.msg('借书失败，可能书被其他同学借走了，请刷新页面重试!', {time: 3000});
                    }
                });
            }, function(){
                // 取消回调
            });
        });
    });
</script>
</body>
</html>
