<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>欢迎使用</title>
    <link rel="stylesheet" href="https://www.layuicdn.com/layui-v2.6.8/css/layui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
    <script src="https://www.layuicdn.com/layui-v2.6.8/layui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --primary-color: #1aa094;
            --secondary-color: #FF5722;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        body {
            background-color: #f5f7fa;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .welcome-container {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .stat-card {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .stat-card h3 {
            color: #666;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card h2 {
            color: #333;
            font-size: 32px;
            margin: 0;
            font-weight: bold;
        }

        .chart-container {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            height: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .chart-container:hover {
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .hot-books-card {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
        }

        .hot-books-card h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-color);
        }

        .layui-table {
            border-radius: 8px;
            overflow: hidden;
        }

        .layui-table thead tr {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .layui-table tbody tr:hover {
            background-color: rgba(26, 160, 148, 0.05);
        }

        .welcome-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .welcome-banner h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome-banner p {
            font-size: 18px;
            opacity: 0.9;
        }

        .quick-actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .quick-action-btn {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .quick-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .quick-action-btn i {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .quick-action-btn span {
            display: block;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-banner animate__animated animate__fadeIn">
            <h1>欢迎使用图书管理系统</h1>
            <p>高效管理您的图书资源，让阅读更便捷</p>
        </div>

        <div class="quick-actions">
            <div class="quick-action-btn animate__animated animate__fadeInUp" onclick="location.href='/BookManager/manager/book_info_list.html'">
                <i class="fas fa-book"></i>
                <span>图书管理</span>
            </div>
            <div class="quick-action-btn animate__animated animate__fadeInUp" style="animation-delay: 0.2s" onclick="location.href='/BookManager/manager/borrow_list.html'">
                <i class="fas fa-exchange-alt"></i>
                <span>借阅管理</span>
            </div>
            <div class="quick-action-btn animate__animated animate__fadeInUp" style="animation-delay: 0.4s" onclick="location.href='/BookManager/manager/user_list.html'">
                <i class="fas fa-users"></i>
                <span>用户管理</span>
            </div>
        </div>

        <div class="layui-row layui-col-space15">
            <!-- 统计卡片 -->
            <div class="layui-col-md4">
                <div class="stat-card animate__animated animate__fadeInLeft">
                    <h3><i class="fas fa-book"></i> 总图书数</h3>
                    <h2 id="totalBooks">0</h2>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="stat-card animate__animated animate__fadeInLeft" style="animation-delay: 0.2s">
                    <h3><i class="fas fa-book-reader"></i> 借出图书数</h3>
                    <h2 id="borrowedBooks">0</h2>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="stat-card animate__animated animate__fadeInLeft" style="animation-delay: 0.4s">
                    <h3><i class="fas fa-book-open"></i> 可用图书数</h3>
                    <h2 id="availableBooks">0</h2>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md6">
                <div class="chart-container animate__animated animate__fadeInUp" id="categoryChart"></div>
            </div>
            <div class="layui-col-md6">
                <div class="chart-container animate__animated animate__fadeInUp" style="animation-delay: 0.2s" id="borrowTrendChart"></div>
            </div>
        </div>

        <!-- 热门图书排行榜 -->
        <div class="layui-row">
            <div class="layui-col-md12">
                <div class="hot-books-card animate__animated animate__fadeInUp" style="animation-delay: 0.4s">
                    <h3><i class="fas fa-chart-line"></i> 热门图书排行榜</h3>
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>书名</th>
                                <th>作者</th>
                                <th>借阅次数</th>
                            </tr>
                        </thead>
                        <tbody id="hotBooksList">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        layui.use(['jquery'], function(){
            var $ = layui.jquery;
            
            // 初始化图表
            var categoryChart = echarts.init(document.getElementById('categoryChart'));
            var borrowTrendChart = echarts.init(document.getElementById('borrowTrendChart'));

            // 加载统计数据
            function loadStatistics() {
                $.get('/BookManager/api/dashboard/statistics', function(data) {
                    console.log('Statistics data:', data);
                    $('#totalBooks').text(data.TOTAL_BOOKS);
                    $('#borrowedBooks').text(data.BORROWED_BOOKS);
                    $('#availableBooks').text(data.AVAILABLE_BOOKS);
                }).fail(function(jqXHR, textStatus, errorThrown) {
                    console.error('Error loading statistics:', textStatus, errorThrown);
                });
            }

            // 加载分类统计
            function loadCategoryStats() {
                $.get('/BookManager/api/dashboard/category-stats', function(data) {
                    console.log('Category stats data:', data);
                    var option = {
                        title: {
                            text: '图书分类统计',
                            left: 'center'
                        },
                        tooltip: {
                            trigger: 'item',
                            formatter: '{a} <br/>{b}: {c} ({d}%)'
                        },
                        legend: {
                            orient: 'vertical',
                            left: 'left',
                            data: data.map(function(item) {
                                return item.CATEGORY;
                            })
                        },
                        series: [{
                            name: '图书数量',
                            type: 'pie',
                            radius: '50%',
                            data: data.map(function(item) {
                                return {
                                    value: item.COUNT,
                                    name: item.CATEGORY
                                };
                            }),
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                                }
                            }
                        }]
                    };
                    categoryChart.setOption(option);
                }).fail(function(jqXHR, textStatus, errorThrown) {
                    console.error('Error loading category stats:', textStatus, errorThrown);
                });
            }

            // 加载借阅趋势
            function loadBorrowTrend() {
                console.log('开始加载借阅与归还趋势数据...');
                
                // 设置一个默认的空图表，避免空白
                var defaultOption = {
                    title: {
                        text: '近7天借阅与归还趋势',
                        left: 'center'
                    },
                    tooltip: {
                        trigger: 'axis'
                    },
                    legend: {
                        data: ['借阅数量', '归还数量'],
                        bottom: 10
                    },
                    xAxis: {
                        type: 'category',
                        data: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7']
                    },
                    yAxis: {
                        type: 'value',
                        name: '数量'
                    },
                    series: [
                        {
                            name: '借阅数量',
                            data: [0, 0, 0, 0, 0, 0, 0],
                            type: 'line',
                            smooth: true,
                            itemStyle: {
                                color: '#1aa094'
                            }
                        },
                        {
                            name: '归还数量',
                            data: [0, 0, 0, 0, 0, 0, 0],
                            type: 'line',
                            smooth: true,
                            itemStyle: {
                                color: '#FF5722'
                            }
                        }
                    ]
                };
                
                // 先显示默认空图表
                borrowTrendChart.setOption(defaultOption);
                
                // 尝试加载真实数据
                $.ajax({
                    url: '/BookManager/api/dashboard/borrow-return-trend',
                    type: 'GET',
                    dataType: 'json',
                    success: function(data) {
                        console.log('成功获取借阅与归还趋势数据:', data);
                        if (data && data.length > 0) {
                            var option = {
                                title: {
                                    text: '近7天借阅与归还趋势',
                                    left: 'center'
                                },
                                tooltip: {
                                    trigger: 'axis'
                                },
                                legend: {
                                    data: ['借阅数量', '归还数量'],
                                    bottom: 10
                                },
                                xAxis: {
                                    type: 'category',
                                    data: data.map(function(item) {
                                        return item.DATE;
                                    })
                                },
                                yAxis: {
                                    type: 'value',
                                    name: '数量'
                                },
                                series: [
                                    {
                                        name: '借阅数量',
                                        data: data.map(function(item) {
                                            return item.BORROW_COUNT;
                                        }),
                                        type: 'line',
                                        smooth: true,
                                        itemStyle: {
                                            color: '#1aa094'
                                        }
                                    },
                                    {
                                        name: '归还数量',
                                        data: data.map(function(item) {
                                            return item.RETURN_COUNT;
                                        }),
                                        type: 'line',
                                        smooth: true,
                                        itemStyle: {
                                            color: '#FF5722'
                                        }
                                    }
                                ]
                            };
                            borrowTrendChart.setOption(option);
                        } else {
                            console.warn('API返回了空数据');
                        }
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        console.error('加载借阅与归还趋势失败:', textStatus, errorThrown);
                        // 错误发生时，保持默认图表
                    }
                });
            }

            // 加载热门图书
            function loadHotBooks() {
                $.get('/BookManager/api/dashboard/hot-books', function(data) {
                    console.log('Hot books data:', data);
                    var html = '';
                    data.forEach(function(book, index) {
                        html += '<tr>' +
                            '<td>' + (index + 1) + '</td>' +
                            '<td>' + book.TITLE + '</td>' +
                            '<td>' + book.AUTHOR + '</td>' +
                            '<td>' + book.BORROW_COUNT + '</td>' +
                            '</tr>';
                    });
                    $('#hotBooksList').html(html);
                }).fail(function(jqXHR, textStatus, errorThrown) {
                    console.error('Error loading hot books:', textStatus, errorThrown);
                });
            }

            // 页面加载完成后初始化数据
            $(document).ready(function() {
                // 确保图表容器有明确的尺寸
                $('#categoryChart, #borrowTrendChart').css({
                    'width': '100%',
                    'height': '400px'
                });

                // 重新初始化图表
                categoryChart = echarts.init(document.getElementById('categoryChart'));
                borrowTrendChart = echarts.init(document.getElementById('borrowTrendChart'));

                // 加载数据
                loadStatistics();
                loadCategoryStats();
                loadBorrowTrend();
                loadHotBooks();
            });

            // 窗口大小改变时重绘图表
            window.onresize = function() {
                categoryChart.resize();
                borrowTrendChart.resize();
            };
        });
    </script>
</body>
</html>
