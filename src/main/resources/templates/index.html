<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>图书管理系统-登录</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <link rel="stylesheet" href="./layuimini/lib/layui-v2.6.3/css/layui.css" media="all">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <!--[if lt IE 9]>
    <script src="https://cdn.staticfile.org/html5shiv/r29/html5.min.js"></script>
    <script src="https://cdn.staticfile.org/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif;
        }
        body {
            background: url('layuimini/images/backgound.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            position: relative;
            z-index: 1;
        }
        .login-form {
            flex: 1;
            padding: 50px;
        }
        .login-image {
            flex: 1;
            background: url('layuimini/images/bg.jpg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .login-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
        }
        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }
        .admin-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .admin-header p {
            color: #666;
            font-size: 16px;
        }
        .layui-form-item {
            margin-bottom: 25px;
        }
        .layui-input {
            height: 50px;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding-left: 15px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .layui-input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
        .layui-form-select {
            width: 100%;
        }
        .layui-form-select .layui-input {
            height: 50px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .layui-btn {
            flex: 1;
            height: 50px;
            line-height: 50px;
            border-radius: 8px;
            font-size: 16px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border: none;
            transition: all 0.3s;
        }
        .layui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        .copyright {
            text-align: center;
            margin-top: 30px;
            color: #fff;
            font-size: 14px;
            position: relative;
        }
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            z-index: 100;
        }
        .admin-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        #admin-login-modal {
            display: none;
            padding: 30px;
            border-radius: 10px;
        }
        #admin-login-modal .layui-form-item {
            margin-bottom: 20px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            .login-image {
                display: none;
            }
            .login-form {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <div class="admin-header">
                <h1>图书管理系统</h1>
                <p id="login-subtitle">读者登录</p>
            </div>
            <!-- 读者登录表单 -->
            <form class="layui-form" action="" id="reader-form">
                <div class="layui-form-item">
                    <input type="text" name="username" placeholder="请输入用户名" autocomplete="off" class="layui-input" value="">
                </div>
                <div class="layui-form-item">
                    <input type="password" name="password" placeholder="请输入密码" autocomplete="off" class="layui-input" value="">
                </div>
                <input type="hidden" name="authority" value="reader">
                <div class="btn-group">
                    <button class="layui-btn" lay-submit="" lay-filter="login">确认登录</button>
                    <button class="layui-btn" id="btn_register" type="button">注册账号</button>
                </div>
            </form>
        </div>
        <div class="login-image"></div>
    </div>
    
    <!-- 管理员登录链接 -->
    <a href="javascript:;" class="admin-link" id="admin-login-link">管理员登录</a>
    
    <!-- 管理员登录弹窗 -->
    <div id="admin-login-modal">
        <form class="layui-form" action="" id="admin-form">
            <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-block">
                    <input type="text" name="username" value="root" disabled class="layui-input" style="background-color: #f9f9f9;">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">密码</label>
                <div class="layui-input-block">
                    <input type="password" name="password" placeholder="请输入管理员密码" autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <input type="hidden" name="authority" value="manager">
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit="" lay-filter="admin-login">登录</button>
                    <button type="button" class="layui-btn layui-btn-primary" id="admin-cancel">取消</button>
                </div>
            </div>
        </form>
    </div>
    
    <div class="copyright">
        <p>© 2024 图书管理系统. All rights reserved</p>
    </div>
<script src="./layuimini/lib/layui-v2.6.3/layui.js" charset="utf-8"></script>
<script>
    layui.use(['form', 'layer'], function () {
        var form = layui.form,
            layer = layui.layer,
            $ = layui.$;

        // 注册按钮点击
        $("#btn_register").click(function () {
            location.href="register.html";
        });

        // 管理员登录链接点击
        $("#admin-login-link").click(function() {
            layer.open({
                type: 1,
                title: '管理员登录',
                area: ['400px', '300px'],
                content: $('#admin-login-modal'),
                scrollbar: false
            });
        });
        
        // 管理员登录取消按钮
        $("#admin-cancel").click(function() {
            layer.closeAll();
        });

        // 登录过期的时候，跳出ifram框架
        if (top.location !== self.location) top.location = self.location;

        // 读者登录提交
        form.on('submit(login)', function (data) {
            data = data.field;
            if (data.username === '') {
                layer.msg('用户名不能为空');
                return false;
            }
            if (data.password === '') {
                layer.msg('密码不能为空');
                return false;
            }

            $.ajax({
                url: "user/login",
                data: {
                    'username': data.username,
                    'password': data.password,
                    'authority': data.authority
                },
                type: 'post',
                datatype: 'json',
                success: function (res) {
                    // return: 0账号或密码错误，1登录成功
                    switch (res) {
                        case 0:
                            layer.msg("账号或密码错误!",{time:1000});
                            break;
                        case 1: //登录成功
                            layer.msg("登录成功",{time:1000},function () {
                                location.href="reader/reader_index.html";
                            });
                            break;
                    }
                }
            });
            return false;
        });
        
        // 管理员登录提交
        form.on('submit(admin-login)', function (data) {
            data = data.field;
            if (data.password === '') {
                layer.msg('密码不能为空');
                return false;
            }

            $.ajax({
                url: "user/login",
                data: {
                    'username': 'root', // 固定用户名为root
                    'password': data.password,
                    'authority': 'manager'
                },
                type: 'post',
                datatype: 'json',
                success: function (res) {
                    // return: 0账号或密码错误，1登录成功
                    switch (res) {
                        case 0:
                            layer.msg("管理员密码错误!",{time:1000});
                            break;
                        case 1: //登录成功
                            layer.msg("管理员登录成功",{time:1000},function () {
                                location.href="manager/manager_index.html";
                            });
                            break;
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
